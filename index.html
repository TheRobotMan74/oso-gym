<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Rutina, registro de pesos, progreso y comida de Oso Gym.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Oso Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1c211c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oso Gym">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna (máx 560px), encabezado fijo arriba, barra de pestañas abajo; números grandes en condensada tipo disco de pesas. */
:root {
  --bg: #eceee9;
  --surface: #ffffff;
  --surface-2: #f4f5f1;
  --ink: #1b1f1a;
  --muted: #5d665b;
  --line: #d6dbd2;
  --accent: #c9761a;      /* miel */
  --accent-ink: #9a5810;
  --on-accent: #1d1406;
  --accent-soft: rgba(201, 118, 26, .14);
  --prot: #2f64ad;        /* proteína */
  --prot-soft: rgba(47, 100, 173, .14);
  --good: #2c7a4b;
  --good-soft: rgba(44, 122, 75, .13);
  --warn: #b5470f;
  --warn-soft: rgba(181, 71, 15, .12);
  --scrim: rgba(18, 22, 18, .45);
  --shadow: 0 1px 2px rgba(20, 26, 20, .06), 0 6px 20px rgba(20, 26, 20, .06);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121512; --surface: #1b1f1b; --surface-2: #232823; --ink: #eceee8; --muted: #9ca596; --line: #2f362e;
    --accent: #eea23f; --accent-ink: #f3b35e; --on-accent: #1d1406; --accent-soft: rgba(238, 162, 63, .16);
    --prot: #78a8ec; --prot-soft: rgba(120, 168, 236, .16); --good: #5cbb80; --good-soft: rgba(92, 187, 128, .15);
    --warn: #f08a4f; --warn-soft: rgba(240, 138, 79, .15); --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121512; --surface: #1b1f1b; --surface-2: #232823; --ink: #eceee8; --muted: #9ca596; --line: #2f362e;
  --accent: #eea23f; --accent-ink: #f3b35e; --on-accent: #1d1406; --accent-soft: rgba(238, 162, 63, .16);
  --prot: #78a8ec; --prot-soft: rgba(120, 168, 236, .16); --good: #5cbb80; --good-soft: rgba(92, 187, 128, .15);
  --warn: #f08a4f; --warn-soft: rgba(240, 138, 79, .15); --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; }
.top h1 { font-family: var(--display); font-weight: 800; font-size: 30px; letter-spacing: .01em; text-transform: uppercase; line-height: 1; flex: 1; min-width: 0; }
.top h1 small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; letter-spacing: .02em; text-transform: none; color: var(--muted); margin-top: 3px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync.ok i { background: var(--good); }
.sync.busy i { background: var(--accent); }
.sync.err i { background: var(--warn); }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 4px calc(var(--nav-h) + 28px); }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.wrap.with-timer { padding-bottom: 64px; }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
nav.tabs button { background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .02em; position: relative; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
nav.tabs .live { position: absolute; top: 9px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--surface); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.hero { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.card.hero .muted { color: color-mix(in srgb, var(--bg) 70%, var(--ink)); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap-ok { flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; text-transform: uppercase; letter-spacing: .01em; }
.h3 { font-weight: 700; font-size: 16px; line-height: 1.25; }
.num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1; }
.big { font-size: 40px; }
.mid { font-size: 26px; }
.tab { font-variant-numeric: tabular-nums; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 2px 0; }
.sec-title h2 { font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 700; font-size: 15px; background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn.block { width: 100%; }
.btn.ghost { background: var(--surface-2); color: var(--ink); border-color: var(--line); }
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.danger { background: var(--warn-soft); color: var(--warn); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: default; }
.hero .btn.ghost { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); }
.icon-btn { width: 40px; height: 40px; flex: none; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.plain { border-color: transparent; background: transparent; }
.link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 700; font-size: 13.5px; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 8px 6px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 3px 9px; font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.acc { background: var(--accent-soft); color: var(--accent-ink); }
.pill.prot { background: var(--prot-soft); color: var(--prot); }
.pill svg { width: 13px; height: 13px; }

.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--accent); transition: width .4s ease; }
.bar.prot i { background: var(--prot); }
.bar.over i { background: var(--good); }

.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.li:first-child { border-top: 0; }
.li .grow > * { overflow-wrap: anywhere; }
.li .chev { color: var(--muted); width: 18px; height: 18px; flex: none; }

label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.inp { width: 100%; min-width: 0; min-height: 44px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-size: 16px; color: var(--ink); font-weight: 500; }
.inp:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
select.inp { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
textarea.inp { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

/* Semana: puntos */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.week .dot { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 13px; font-weight: 700; color: var(--muted); }
.week .dot.done { background: var(--accent); border: 2px solid var(--accent); color: var(--on-accent); }
.week .dot.today { border-style: solid; border-color: var(--ink); color: var(--ink); }
.week .dot.done.today { border-color: var(--ink); }
.week .dot svg { width: 16px; height: 16px; }

/* Hábitos */
.habits { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.habit { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); text-align: left; font-weight: 600; font-size: 13.5px; min-height: 52px; }
.habit .box { width: 22px; height: 22px; flex: none; border-radius: 7px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--on-accent); background: var(--surface); }
.habit .box svg { width: 14px; height: 14px; }
.habit.on { background: var(--good-soft); border-color: transparent; }
.habit.on .box { background: var(--good); border-color: var(--good); color: #fff; }
.habit.auto { cursor: default; }

/* Entreno */
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ex.done-all { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.ex-head { display: flex; align-items: flex-start; gap: 10px; padding: 14px 14px 10px; }
.ex-head .idx { font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--muted); width: 22px; flex: none; line-height: 1.1; }
.ex-head .h3 { overflow-wrap: anywhere; }
.target { margin: 0 14px 10px; padding: 9px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 13.5px; display: flex; gap: 8px; align-items: flex-start; }
.target.up { background: var(--good-soft); }
.target svg { width: 16px; height: 16px; flex: none; margin-top: 2px; color: var(--accent-ink); }
.target.up svg { color: var(--good); }
.sets { display: flex; flex-direction: column; }
.set-h, .set { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 72px 48px; gap: 8px; align-items: center; padding: 0 14px; }
.set-h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-bottom: 4px; }
.set { padding-block: 6px; }
.set .n { font-family: var(--display); font-weight: 700; font-size: 18px; text-align: center; color: var(--muted); }
.set .inp { text-align: center; font-family: var(--display); font-size: 21px; font-weight: 700; padding: 4px 6px; min-height: 44px; font-variant-numeric: tabular-nums; }
.set .prev { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.2; font-variant-numeric: tabular-nums; }
.set .ok { width: 48px; height: 44px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); display: flex; align-items: center; justify-content: center; }
.set .ok svg { width: 22px; height: 22px; }
.set.done { background: var(--good-soft); }
.set.done .ok { background: var(--good); border-color: var(--good); color: #fff; }
.set.done .inp { background: transparent; border-color: transparent; }
.set.pr .n { color: var(--accent-ink); }
.ex-foot { display: flex; gap: 8px; padding: 8px 14px 14px; flex-wrap: wrap; }

.timer { position: fixed; left: 0; right: 0; z-index: 19; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 8px; pointer-events: none; }
.timer .in { pointer-events: auto; max-width: 560px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); position: relative; overflow: hidden; }
.timer .fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width 1s linear; }
.timer .num { font-size: 30px; min-width: 70px; }
.timer .lbl { flex: 1; min-width: 0; font-size: 12.5px; opacity: .8; line-height: 1.25; }
.timer button { border: 0; background: color-mix(in srgb, var(--bg) 14%, transparent); color: var(--bg); border-radius: 10px; height: 40px; padding: 0 12px; font-weight: 700; font-size: 13.5px; }
.timer.end .in { background: var(--accent); color: var(--on-accent); }
.timer.end button { color: var(--on-accent); background: rgba(0,0,0,.1); }

/* Comida */
.macro { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.macro .big { font-size: 36px; }
.macro .k { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
.food-li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.food-li:first-child { border-top: 0; }
.food-li .kc { text-align: right; flex: none; font-variant-numeric: tabular-nums; }
.datebar { display: flex; align-items: center; gap: 6px; }
.datebar .lbl { flex: 1; text-align: center; font-weight: 700; }
.add-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.add-grid.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.add-grid .btn { flex-direction: column; gap: 4px; min-height: 64px; padding: 6px 4px; font-size: 12.5px; white-space: normal; }
.add-grid .btn svg { width: 22px; height: 22px; }
.photo-btns { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.photo-btns .btn { white-space: normal; text-align: center; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.idea { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.idea .row .pill { flex: none; }

/* Gráficas */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 10px; font-family: var(--body); font-variant-numeric: tabular-nums; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .ln2 { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: .55; }
.chart .area { fill: var(--accent-soft); stroke: none; }
.chart .pt { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .end { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .endlbl { fill: var(--ink); font-family: var(--display); font-weight: 700; font-size: 13px; }
.chart .bar-r { fill: var(--accent); }
.chart .bar-r.mute { fill: var(--line); }
.chart .goal { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 3 4; }
.spark { width: 84px; height: 32px; flex: none; overflow: visible; }
.spark polyline { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--accent); }

.empty { text-align: center; padding: 22px 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty svg { width: 34px; height: 34px; color: var(--muted); }

/* Hoja inferior */
.sheet-bg { position: fixed; inset: 0; z-index: 40; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet { width: 100%; max-width: 600px; max-height: 90%; background: var(--surface); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; animation: up .22s cubic-bezier(.2,.8,.3,1); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
.sheet-h h3 { flex: 1; min-width: 0; font-family: var(--display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }
.sheet-b { overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
@keyframes up { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 60; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 74px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: up .2s ease; display: flex; gap: 12px; align-items: center; }
.toast button { background: none; border: 0; color: var(--accent); font-weight: 800; padding: 0; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .num { font-size: 24px; }
.cues { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
.note { font-size: 13px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; color: var(--muted); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.tbl th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.tbl td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.scroll-x { overflow-x: auto; }
.ring-wrap { display: flex; align-items: center; gap: 16px; }
.countdown { display: flex; align-items: baseline; gap: 6px; }
@media (max-width: 380px) {
  .set-h, .set { grid-template-columns: 24px minmax(0, 1fr) minmax(0, 1fr) 56px 44px; gap: 6px; padding: 0 10px; }
  .set .ok { width: 44px; }
  .big { font-size: 34px; }
  .habits { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

const DEFAULT_ROUTINE = PLAN.days.map(d => ({

  items: d.exercises.map(e => ({ ex: e.id, sets: e.sets, lo: e.repsMin, hi: e.repsMax, rest: e.restSec, inc: e.incrementLb, note: e.note || '' })),

for (const m of PLAN.nutrition.meals) RECIPES.unshift({ n: m.name, cat: 'Del plan', tags: MEAL_TAGS[m.id] || 'cn', rinde: 1, g: null, kcal: m.kcal, p: m.proteinG, c: null, f: null, time: '', ing: m.ingredients.split(/,\s*/), steps: [], plan: true });

function weekOf(iso) {
  const w = PLAN.weeks.find(w => iso >= w.start && iso <= w.end);

}

// ---------- Estado
const LS_KEY = 'osogym.v1';
const LS_META = 'osogym.meta.v1';
function defaultState() {

    settings: { name: '', sex: 'm', age: null, heightCm: null, weightKg: null, kcalAdjust: 0, lastAdjust: null, kcalOverride: null, protOverride: null, liftUnit: 'lb', bodyUnit: 'kg', theme: 'auto' },

}
function readLS(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function writeLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function normalize(s) {
  const d = defaultState();
  s = Object.assign(d, s || {});
  s.settings = Object.assign(defaultState().settings, s.settings || {});
  if (!Array.isArray(s.routine) || !s.routine.length) s.routine = clone(DEFAULT_ROUTINE);
  s.bw = (s.bw || []).filter(x => x && x.d && x.kg > 0).sort((a, b) => a.d < b.d ? -1 : 1);
  s.workouts = (s.workouts || []).sort((a, b) => (a.start || 0) - (b.start || 0));

let S = normalize(readLS(LS_KEY));

const subs = new Set();

  const [, force] = useState(0);

  return S;
}

const U = { tab: 'hoy', sheet: null, toast: null, timer: null, foodDate: null, sync: 'local' };

function useUI() {

// ---------- Sincronización con la cuenta (capacidad db del artifact)
// Cada "shard" es un documento: main (ajustes, rutina, peso), w-AAAA-MM (entrenos del mes), d-AAAA-MM (comida y hábitos del mes).
function shardsOf(s) {
  const out = { main: { settings: s.settings, routine: s.routine, routineVersion: s.routineVersion, bw: s.bw, customFoods: s.customFoods, recent: s.recent, checkins: s.checkins, active: s.active } };
  for (const w of s.workouts) { const k = 'w-' + w.date.slice(0, 7); (out[k] = out[k] || { workouts: [] }).workouts.push(w); }
  for (const d of Object.keys(s.days)) { const k = 'd-' + d.slice(0, 7); (out[k] = out[k] || { days: {} }).days[d] = s.days[d]; }
  return out;
}
function fromShards(sh) {
  const m = sh.main || {};
  const s = { settings: m.settings, routine: m.routine, routineVersion: m.routineVersion, bw: m.bw, customFoods: m.customFoods, recent: m.recent, checkins: m.checkins, active: m.active, workouts: [], days: {} };
  for (const [k, v] of Object.entries(sh)) {
    if (k.startsWith('w-')) s.workouts.push(...(v.workouts || []));
    if (k.startsWith('d-')) Object.assign(s.days, v.days || {});
  }
  return normalize(s);
}
const emptyShard = k => k.startsWith('w-') ? { workouts: [] } : k.startsWith('d-') ? { days: {} } : {};

const Sync = {
  db: null, timer: null, flushing: false, ready: false,
  changed(now) {
    const sh = shardsOf(S);
    const keys = new Set([...Object.keys(sh), ...Object.keys(META.hash)]);
    let any = false;
    for (const k of keys) {
      const j = JSON.stringify(sh[k] || emptyShard(k));
      if (META.hash[k] !== j) { META.hash[k] = j; META.at[k] = Date.now(); if (!META.dirty.includes(k)) META.dirty.push(k); any = true; }
    }
    if (any) { writeLS(LS_META, META); this.schedule(now ? 50 : 1500); }
  },
  schedule(ms) { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms); },
  async flush() {
    if (!this.db || !this.ready || this.flushing || !META.dirty.length) return;
    this.flushing = true; ui({ sync: 'busy' });
    try {
      while (META.dirty.length) {
        const k = META.dirty[0];
        const body = JSON.parse(META.hash[k] || '{}');
        await this.db.doc('oso/' + k).set({ ...body, _at: META.at[k] || Date.now() });
        if (META.dirty[0] === k) META.dirty.shift();
        writeLS(LS_META, META);
      }
      ui({ sync: 'ok' });
    } catch (e) {
      ui({ sync: 'err' });
      if (e && e.code === 'quota_exceeded') toast('Se llenó el espacio de la cuenta. Exporta un respaldo.');
      else this.schedule(15000);
    } finally { this.flushing = false; }
  },
  async pull() {
    if (!this.db) return;
    try {
      const snap = await this.db.collection('oso').get();
      const local = shardsOf(S);
      let changed = false;
      for (const doc of snap.docs) {
        const k = doc.id, d = { ...doc.data() }; const at = d._at || 0; delete d._at;
        if (at > (META.at[k] || 0)) { local[k] = d; META.hash[k] = JSON.stringify(d); META.at[k] = at; META.dirty = META.dirty.filter(x => x !== k); changed = true; }
        else if (at < (META.at[k] || 0) && !META.dirty.includes(k)) META.dirty.push(k);
      }
      const remote = new Set(snap.docs.map(d => d.id));
      for (const k of Object.keys(local)) if (!remote.has(k) && !META.dirty.includes(k)) { META.dirty.push(k); META.hash[k] = JSON.stringify(local[k]); META.at[k] = META.at[k] || Date.now(); }
      if (changed) { S = fromShards(local); writeLS(LS_KEY, S); emit(); }
      writeLS(LS_META, META);
      this.ready = true;
      ui({ sync: META.dirty.length ? 'busy' : 'ok' });
      this.flush();
    } catch (e) { ui({ sync: 'err' }); }
  },
  async init() {
    try {
      if (!window.claude || !window.claude.use) return;
      const db = await window.claude.use('db');
      if (!db) return;
      this.db = db;
      await this.pull();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !this.flushing) this.pull(); });
    } catch (e) { ui({ sync: 'local' }); }
  },
};

// ---------- Lógica de entrenamiento
const liftU = () => S.settings.liftUnit;
function convW(w, from, to) { if (w == null) return null; if (from === to) return w; return from === 'lb' ? w * LB : w / LB; }
function dispW(w, from) { const v = convW(w, from || 'lb', liftU()); return v == null ? '' : (Math.round(v * 10) / 10); }
function incFor(item) { const inc = item.inc != null ? item.inc : (EX[item.ex] ? EX[item.ex].inc : 5); return liftU() === 'lb' ? inc : (inc >= 10 ? 5 : inc > 0 ? 2.5 : 0); }
function workingSets(w, exId) { const e = w.ex.find(x => x.ex === exId); return e ? e.sets.filter(s => s.done && s.r > 0) : []; }
function historyFor(exId) {
  const out = [];
  for (const w of S.workouts) {
    const sets = workingSets(w, exId);
    if (!sets.length) continue;
    const ws = sets.map(s => ({ w: convW(s.w || 0, w.unit, liftU()), r: s.r }));
    const best = ws.reduce((b, s) => e1rm(s.w, s.r) > e1rm(b.w, b.r) ? s : b, ws[0]);
    out.push({ id: w.id, date: w.date, start: w.start, sets: ws, top: Math.max(...ws.map(s => s.w)), best, e1rm: e1rm(best.w, best.r) || best.r, vol: sum(ws, s => s.w * s.r), reps: sum(ws, s => s.r) });
  }
  return out;
}
function suggest(item, setsCount) {

function niceTicks(min, max, n = 4) {
  if (!isFinite(min) || !isFinite(max)) return [0, 1];
  if (max - min < 1e-9) { const d = Math.max(1, Math.abs(max) * 0.05); min -= d; max += d; }

  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 1000; v += step) out.push(Math.round(v * 1000) / 1000);
  return out;
}

  const last = main[main.length - 1];

function RestTimer() {
  const u = useUI();
  const [, tick] = useState(0);
  useEffect(() => { const i = setInterval(() => tick(x => x + 1), 250); return () => clearInterval(i); }, []);
  const t = u.timer; if (!t) return null;
  const left = Math.ceil((t.end - Date.now()) / 1000);
  if (left <= 0 && !t.beeped) { t.beeped = true; beep(); }
  if (left < -60) { setTimeout(() => ui({ timer: null }), 0); }
  const shown = Math.abs(left), mm = Math.floor(shown / 60), ss = pad(shown % 60);
  const pct = clamp((1 - left / t.total) * 100, 0, 100);
  return html`<div class=${'timer ' + (left <= 0 ? 'end' : '')} role="timer" aria-live="off">
    <div class="in">
      <span class="num">${left < 0 ? '+' : ''}${mm}:${ss}</span>
      <span class="lbl">${left <= 0 ? '¡A darle! Siguiente serie' : 'Descanso · ' + t.label}</span>
      ${left > 0 ? html`<button onClick=${() => ui({ timer: { ...t, end: t.end + 15000, total: t.total + 15 } })}>+15 s</button>` : null}
      <button onClick=${() => ui({ timer: null })}>${left > 0 ? 'Saltar' : 'Listo'}</button>
      <span class="fill" style=${`width:${pct}%`}></span>
    </div>
  </div>`;
}

function startWorkout(day, bad) {

function habitDoneAny(iso, id) {
  if (id === 'protein') return habitDone(iso, 'protein');
  return !!(dayOf(iso).habits || {})[id];

function habitStreak() {
  let n = 0, d = today();
  const ok = iso => ['sleep', 'water', 'creatine', 'protein'].filter(id => habitDoneAny(iso, id)).length >= 3;
  if (!ok(d)) d = addDays(d, -1);
  while (ok(d) && n < 500) { n++; d = addDays(d, -1); }
  return n;
}

function weekSummary(ws) {
  const we = addDays(ws, 6);
  const wks = S.workouts.filter(w => w.date >= ws && w.date <= we);
  const prevA = avgKg(addDays(ws, -7), addDays(ws, -1)), a = avgKg(ws, we);
  const t = targets();
  const protDays = Array.from({ length: 7 }, (_, i) => addDays(ws, i)).filter(d => t.p && dayTotals(d).p >= t.p).length;
  const ups = new Set();
  for (const w of wks) for (const e of w.ex) {
    const h = historyFor(e.ex); const i = h.findIndex(x => x.id === w.id);
    if (i > 0 && (h[i].top > h[i - 1].top + 0.01 || (Math.abs(h[i].top - h[i - 1].top) < 0.01 && h[i].reps > h[i - 1].reps))) ups.add(e.ex);
  }
  return { ws, we, n: wks.length, goal: weekGoal(ws), avg: a, prevAvg: prevA, protDays, ups: [...ups] };
}

function prevSets(exId, beforeStart) {
  for (let i = S.workouts.length - 1; i >= 0; i--) {
    const w = S.workouts[i]; if (w.start >= beforeStart) continue;
    const e = w.ex.find(x => x.ex === exId);
    if (e && e.sets.some(s => s.done)) return e.sets.filter(s => s.done).map(s => ({ w: dispW(s.w, w.unit), r: s.r }));
  }
  return null;
}

function ExerciseCard({ w, e, i }) {
  const ex = EX[e.ex] || { n: e.ex, m: [], rest: 90 };
  const prev = useMemo(() => prevSets(e.ex, w.start), [e.ex, w.start, S.workouts.length]);
  const best = useMemo(() => bestBefore(e.ex, w.id), [e.ex, S.workouts.length]);
  const allDone = e.sets.length && e.sets.every(s => s.done);
  const tg = e.target || {};
  const noFail = (PLAN.progression.noFailureExercises || []).includes(e.ex);
  const setVal = (j, k, v) => update(s => {
    const E = s.active.ex[i]; const old = E.sets[j][k];
    E.sets[j][k] = v;
    if (k === 'w') for (let x = j + 1; x < E.sets.length; x++) if (!E.sets[x].done && (E.sets[x].w == null || E.sets[x].w === old)) E.sets[x].w = v;
  });
  const toggle = j => {
    const set = e.sets[j];
    if (set.done) { update(s => { s.active.ex[i].sets[j].done = false; }); return; }
    const wv = set.w != null ? set.w : (ex.bw ? 0 : null);
    if (wv == null) { toast('Escribe el peso que usaste'); const el = document.getElementById(`w-${i}-${j}`); el && el.focus(); return; }
    const rv = set.r != null ? set.r : (tg.r || e.lo);
    update(s => { const S2 = s.active.ex[i].sets[j]; S2.w = wv; S2.r = rv; S2.done = true; }, { now: true });
    const last = j === e.sets.length - 1;
    const allNow = e.sets.every((s, x) => x === j || s.done);
    if (allNow) {
      const nextEx = w.ex[i + 1];
      if (nextEx) startRest(e.rest || ex.rest || 90, 'Sigue: ' + (EX[nextEx.ex] || {}).n);
      else toast('Último ejercicio listo. Dale a Terminar.');
    } else startRest(e.rest || ex.rest || 90, `${ex.n}, serie ${j + 2}`);
    if (!last && e1rm(convW(wv, w.unit, liftU()), rv) > best && best > 0) toast('¡Récord personal en esta serie!');
  };
  return html`<section class=${'ex ' + (allDone ? 'done-all' : '')}>

        ${e.note || noFail ? html`<span class="tiny" style="color:var(--warn);font-weight:700">${[noFail ? 'Nunca al fallo' : '', e.note && e.note !== 'Nunca al fallo' ? e.note : ''].filter(Boolean).join(' · ')}</span>` : null}
      </div>
      <button class="icon-btn plain" aria-label="Técnica" onClick=${() => openSheet('exinfo', { id: e.ex })}><${Icon} n="info" /></button>
      <button class="icon-btn plain" aria-label="Cambiar ejercicio" onClick=${() => openSheet('expick', { mode: 'swap', index: i })}><${Icon} n="swap" /></button>
    </div>
    ${tg.text ? html`<div class=${'target ' + (tg.kind === 'up' ? 'up' : '')}><${Icon} n=${tg.kind === 'up' ? 'upArrow' : tg.kind === 'new' ? 'spark' : 'timer'} /><span>${tg.text}</span></div>` : null}
    <div class="sets">
      <div class="set-h"><span style="text-align:center">#</span><span style="text-align:center">${ex.bw ? 'Extra' : w.unit}</span><span style="text-align:center">Reps</span><span style="text-align:center">Antes</span><span></span></div>
      ${e.sets.map((st, j) => {
        const pr = st.done && best > 0 && e1rm(convW(st.w || 0, w.unit, liftU()), st.r) > best + 0.01;
        const p = prev && prev[j];
        return html`<div class=${`set ${st.done ? 'done' : ''} ${pr ? 'pr' : ''}`}>
          <span class="n">${pr ? html`<span title="Récord" style="display:inline-flex;width:18px;height:18px;color:var(--accent-ink)"><${Icon} n="trophy" /></span>` : j + 1}</span>
          <input id=${`w-${i}-${j}`} class="inp" inputmode="decimal" aria-label=${`Peso serie ${j + 1}`} placeholder=${tg.w != null ? String(tg.w) : (ex.bw ? '0' : '–')} value=${st.w == null ? '' : st.w} onChange=${ev => setVal(j, 'w', num(ev.target.value))} onFocus=${ev => ev.target.select()} />

// ---------- COMIDA: catálogo
const scaleM = (m, k) => ({ kcal: (m.kcal || 0) * k, p: (m.p || 0) * k, c: (m.c || 0) * k, f: (m.f || 0) * k });
const CATALOG = (() => {
  const out = [];
  G_FOODS.forEach(([n, cat, ul, ug, kcal, p, c, f], i) => out.push({ key: 'g' + i, name: n, cat, unitLabel: ul, unitG: ug, k100: { kcal, p, c, f } }));
  U_FOODS.forEach(([n, cat, sv, kcal, p, c, f], i) => out.push({ key: 'u' + i, name: n, cat, unitLabel: sv, per: { kcal, p, c, f } }));
  PRODUCTS.forEach(([n, brand, sv, kcal, p, c, f], i) => out.push({ key: 'p' + i, name: n, brand, cat: 'Súper', unitLabel: sv, per: { kcal, p, c, f } }));
  RECIPES.forEach((r, i) => { r.key = 'r' + i; out.push({ key: r.key, name: r.n, cat: 'Recetas', unitLabel: '1 porción' + (r.g ? ` (~${r.g} g)` : ''), unitG: r.g || null, per: { kcal: r.kcal, p: r.p, c: r.c, f: r.f }, recipe: r }); });
  return out;
})();
const CAT_LIST = ['Recetas', 'Súper', 'Carnes', 'Pescado', 'Huevo', 'Lácteos', 'Cereales', 'Leguminosas', 'Frutas', 'Verduras', 'Grasas', 'Mexicana', 'Restaurantes', 'Botanas', 'Bebidas', 'Suplementos'];
function customItem(f) {
  return { key: 'c' + f.id, name: f.name, brand: f.brand || '', cat: 'Mis comidas', unitLabel: f.serving || '1 porción', unitG: f.servingG || null, per: { kcal: f.kcal, p: f.p || 0, c: f.c || 0, f: f.f || 0 }, barcode: f.barcode || null, custom: f };
}
function findItem(key) {
  if (!key) return null;
  if (key[0] === 'c') { const f = S.customFoods.find(x => 'c' + x.id === key); return f ? customItem(f) : null; }
  return CATALOG.find(x => x.key === key) || null;
}
function findByName(name) { return S.customFoods.map(customItem).find(x => x.name === name) || CATALOG.find(x => x.name === name) || null; }
function itemPerUnit(it) { return it.per || scaleM(it.k100, it.unitG / 100); }
function canGrams(it) { return !!(it.k100 || it.unitG); }
function macrosFor(it, amount, mode) {
  if (mode === 'g') return it.k100 ? scaleM(it.k100, amount / 100) : scaleM(it.per, amount / it.unitG);
  return scaleM(itemPerUnit(it), amount);
}
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[-_/&.,()'’+]/g, ' ');
function aliasQueries(q) {
  const base = norm(q).replace(/\s+/g, ' ').trim(), out = [base];
  const al = typeof ALIASES === 'object' ? ALIASES : {};
  for (const k of Object.keys(al)) {
    const re = new RegExp('(^| )' + k + '( |$)');
    for (const b of out.slice()) if (re.test(b)) out.push(b.replace(re, '$1' + al[k] + '$2'));
  }
  return [...new Set(out)].map(x => x.split(' ').filter(Boolean));
}
function searchItems(q, list) {
  const alts = aliasQueries(q);
  if (!alts[0].length) return list;
  const scored = [];
  for (const it of list) {
    const hay = it._hay || (it._hay = norm(it.name + ' ' + (it.brand || '') + ' ' + it.cat + ' ' + (it.recipe ? it.recipe.ing.join(' ') : '')));
    const wi = alts.findIndex(ws => ws.every(w => hay.includes(w)));
    if (wi < 0) continue;
    const words = alts[wi], nm = norm(it.name);
    scored.push([it, (wi === 0 ? 1 : 0) + (nm.startsWith(words[0]) ? 3 : 0) + (nm.includes(words.join(' ')) ? 2 : 0) + (it.custom ? 2 : 0) - nm.length / 100]);
  }
  return scored.sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
const r1 = n => Math.round(n * 10) / 10;
function amountLabel(it, amount, mode) {
  if (mode === 'g') return `${fmtNum(amount)} g`;
  return `${amount === 1 ? '' : fmtNum(amount, amount % 1 ? 1 : 0) + ' × '}${it.unitLabel}`;
}
function logItem(date, it, amount, mode, meal) {
  const m = macrosFor(it, amount, mode);
  update(s => {
    const d = ensureDay(s, date);
    d.food.push({ id: uid(), name: it.name + (it.brand && !norm(it.name).includes(norm(it.brand)) ? ` (${it.brand})` : ''), serving: amountLabel(it, amount, mode), kcal: Math.round(m.kcal), p: r1(m.p), c: r1(m.c), f: r1(m.f), meal, ref: { key: it.key, amount, mode } });
    s.recent = [it.key, ...(s.recent || []).filter(k => k !== it.key)].slice(0, 30);

}
function logRaw(date, x, meal) {
  update(s => { ensureDay(s, date).food.push({ id: uid(), name: x.name, serving: x.serving || '', kcal: Math.round(x.kcal || 0), p: r1(x.p || 0), c: r1(x.c || 0), f: r1(x.f || 0), meal }); });

// Las fotos del cel pesan 12+ MP; se achican antes de procesarlas para no agotar la memoria (sobre todo en iPhone).
async function loadSmall(file, max) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  try {
    img.src = url;
    await (img.decode ? img.decode() : new Promise((res, rej) => { img.onload = res; img.onerror = rej; }));
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c;
  } finally { img.src = ''; URL.revokeObjectURL(url); }
}
function freeCanvas(c) { if (c) { c.width = 0; c.height = 0; } }
async function shrinkImage(file, max = 1280) {
  let c;
  try { c = await loadSmall(file, max); return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.82)); }
  catch (e) { return file; }
  finally { freeCanvas(c); }
}
function aiError(e) {
  const c = e && e.code;
  if (c === 'not_granted') return 'No diste permiso para usar Claude en la app. Puedes llenarlo a mano.';
  if (c === 'rate_limited') return 'Muchas consultas seguidas. Espera un minuto y vuelve a intentar.';
  if (c === 'invalid_json') return 'No pude leer bien la respuesta. Intenta con otra foto más clara.';
  if (c === 'image_rejected') return 'Esa foto no se pudo usar. Prueba otra (JPG o PNG).';
  if (c === 'cancelled') return 'Cancelado.';
  return 'No se pudo consultar a Claude ahorita. Revisa tu conexión o llénalo a mano.';
}

const ZXING_URL = './zxing.min.js';
let zxingP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (!zxingP) zxingP = new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = ZXING_URL; sc.onload = () => res(window.ZXing); sc.onerror = () => { zxingP = null; rej(new Error('load')); }; document.head.appendChild(sc); });
  return zxingP;
}
async function decodeBarcode(file) {
  for (const max of [1100, 1600, 700]) {
    let c;
    try {
      c = await loadSmall(file, max);
      if ('BarcodeDetector' in window) {
        try {
          const bd = new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
          const r = await bd.detect(c);
          if (r && r.length) return r[0].rawValue;
        } catch (e) { }
      }
      const Z = await loadZXing();
      const hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      const reader = new Z.MultiFormatReader(); reader.setHints(hints);
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)));
      try { return reader.decode(bmp).getText(); } catch (e) { }
    } catch (e) { if (e && e.message === 'load') throw e; }
    finally { freeCanvas(c); }
  }
  return null;
}
const cleanCode = c => String(c || '').replace(/\D/g, '');
function sameCode(a, b) { a = cleanCode(a).replace(/^0+/, ''); b = cleanCode(b).replace(/^0+/, ''); return a && a === b; }

function mealNow() { const h = new Date().getHours(); return h < 11 ? 'd' : h < 17 ? 'c' : h < 21 ? 'n' : 's'; }
function ideasFor(iso, all) {
  const t = targets(iso), tot = dayTotals(iso);
  const R = (t.kcal || 2500) - tot.kcal, P = (t.p || 120) - tot.p;
  const m = mealNow();
  let list = RECIPES.map(x => {
    let sc = 0;
    if (R > 0) sc -= Math.abs(x.kcal - Math.min(R, 900)) / 120; else sc -= x.kcal / 150;
    if (P > 0) sc += Math.min(x.p, P) / 12;
    if (x.tags.includes(m)) sc += 1.5;
    if (x.plan) sc += 0.4;
    return { x, sc };
  });
  if (!all && R > 0) list = list.filter(o => o.x.kcal <= R + 200);
  list.sort((a, b) => b.sc - a.sc);
  return { list: list.map(o => o.x).slice(0, all ? 999 : 4), R, P };
}

// Base pública de productos (solo funciona fuera del artifact; ahí el navegador bloquea la consulta)
async function offLookup(code) {
  if (!navigator.onLine) return null;
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 7000);
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_es,generic_name,brands,serving_size,serving_quantity,nutriments`, { signal: ctl.signal });
    if (!r.ok) return null;
    const j = await r.json(); const p = j && j.product; if (!p) return null;
    const n = p.nutriments || {}; const sq = Number(p.serving_quantity) || null;
    const has = k => n[k] != null && n[k] !== '';
    const kcalOf = sfx => has('energy-kcal' + sfx) ? Number(n['energy-kcal' + sfx]) : has('energy' + sfx) ? Number(n['energy' + sfx]) / 4.184 : null;
    let sfx = '_serving', kcal = kcalOf('_serving'), serving = p.serving_size || '1 porción', servingG = sq;
    if (kcal == null || !sq) { const k100 = kcalOf('_100g'); if (k100 == null) return null; sfx = '_100g'; kcal = k100; serving = '100 g'; servingG = 100; }
    const g = k => has(k + sfx) ? Math.round(Number(n[k + sfx]) * 10) / 10 : 0;
    const name = (p.product_name_es || p.product_name || p.generic_name || '').trim();
    if (!name) return null;
    return { name, brand: (p.brands || '').split(',')[0].trim(), serving, servingG, kcal: Math.round(kcal), p: g('proteins'), c: g('carbohydrates'), f: g('fat') };
  } catch (e) { return null; } finally { clearTimeout(t); }
}

function ScanSheet({ date }) {
  const [st, setSt] = useState({ step: 'start' });
  const [code, setCode] = useState('');
  const lookup = async c => {
    c = cleanCode(c);
    if (c.length < 6) { setSt({ step: 'start', err: 'Ese código está muy corto. Revisa los números.' }); return; }
    const hit = S.customFoods.find(f => f.barcode && sameCode(f.barcode, c));
    if (hit) { openSheet('portion', { ikey: 'c' + hit.id, date }); toast(`Encontrado: ${hit.name}`); return; }
    setSt({ step: 'busy', msg: 'Buscando el producto en internet…', code: c });
    const off = await offLookup(c);
    if (off) { openSheet('quick', { date, barcode: c, prefill: off, note: 'Datos de Open Food Facts (base pública). Revisa que coincidan con la etiqueta y guarda.' }); return; }
    setSt({ step: 'unknown', code: c });
  };
  const onFile = async f => {
    setSt({ step: 'busy', msg: 'Leyendo el código…' });
    let c; try { c = await decodeBarcode(f); if (!c) throw new Error('nf'); } catch (e) { setSt({ step: 'start', err: e && e.message === 'load' ? 'No se pudo cargar el lector de códigos (revisa tu internet). Escribe los números abajo.' : 'No pude leer el código en esa foto. Que el código salga grande, derecho y con buena luz, o escribe los números abajo.' }); return; }
    setCode(c); await lookup(c);
  };
  const readLabel = async f => {
    setSt({ step: 'busy', msg: 'Claude está leyendo la etiqueta…', code: st.code });
    try {
      const img = await shrinkImage(f);
      const r = await AI.sample.json(LABEL_PROMPT, { images: [img], modelTier: 'default' });
      if (!r || r.error) { setSt({ step: 'unknown', code: st.code, err: (r && r.error) || 'No se reconoció la etiqueta.' }); return; }
      openSheet('quick', { date, barcode: st.code, prefill: { name: r.name, brand: r.brand, serving: r.serving, servingG: r.serving_g, kcal: r.kcal, p: r.protein_g, c: r.carbs_g, f: r.fat_g }, note: 'Leído de la etiqueta por Claude. Revisa que los números coincidan.' + (r.notes ? ' ' + r.notes : '') });
    } catch (e) { setSt({ step: 'unknown', code: st.code, err: aiError(e) }); }
  };
  return html`<${Sheet} title="Escanear producto">
    ${st.step === 'busy' ? html`<div class="empty"><span class="spinner"></span><p class="muted">${st.msg}</p></div>` : null}
    ${st.step === 'start' ? html`
      <p class="small muted">Tómale foto al código de barras del empaque. La primera vez que escaneas un producto le tomas foto a su tabla nutrimental y queda guardado; las siguientes veces sale directo.</p>
      ${st.err ? html`<p class="note" style="color:var(--warn)">${st.err}</p>` : null}
      <${PhotoButton} id="scan-file" label="Foto del código de barras" icon="barcode" onFile=${onFile} />
      <form class="row" onSubmit=${e => { e.preventDefault(); lookup(code); }}>
        <input id="scan-code" class="inp grow" inputmode="numeric" placeholder="O escribe los números" value=${code} onInput=${e => setCode(e.target.value)} />
        <button class="btn ghost" type="submit">Buscar</button>
      </form>
      ${S.customFoods.some(f => f.barcode) ? html`<p class="tiny muted">${S.customFoods.filter(f => f.barcode).length} productos escaneados guardados.</p>` : null}
    ` : null}
    ${st.step === 'unknown' ? html`
      <p>Todavía no conozco el código <b class="tab">${st.code}</b>.</p>
      ${st.err ? html`<p class="note" style="color:var(--warn)">${st.err}</p>` : null}
      ${AI.images ? html`<${PhotoButton} id="label-file" label="Foto de la tabla nutrimental" icon="camera" onFile=${readLabel} /><p class="tiny muted">Claude lee la etiqueta y llena los datos. Usa tu cuenta de Claude; la primera vez te pide permiso.</p>` : null}
      <button class=${'btn block ' + (AI.images ? 'ghost' : '')} onClick=${() => openSheet('quick', { date, barcode: st.code })}><${Icon} n="edit" />Llenar a mano</button>
      <button class="btn quiet block" onClick=${() => { setCode(''); setSt({ step: 'start' }); }}>Escanear otro</button>
    ` : null}
  <//>`;
}

  const [st, setSt] = useState({ step: 'input' });
  const [meal, setMeal] = useState(mealNow());
  const ctl = useRef(null);
  const run = async (prompt, images) => {
    if (!AI.sample) { setSt({ step: 'input', err: 'Esta función solo funciona abriendo la app desde tu cuenta de Claude.' }); return; }
    ctl.current = new AbortController();
    setSt({ step: 'busy' });
    try {
      const r = await AI.sample.json(prompt, { images, modelTier: 'default', signal: ctl.current.signal });
      if (!r || r.error || !Array.isArray(r.items) || !r.items.length) { setSt({ step: 'input', err: (r && r.error) || 'No identifiqué comida. Intenta de nuevo.' }); return; }
      setSt({ step: 'result', items: r.items.map(x => ({ name: String(x.name || 'Alimento'), serving: String(x.amount || ''), kcal: +x.kcal || 0, p: +x.protein_g || 0, c: +x.carbs_g || 0, f: +x.fat_g || 0, on: true })), notes: r.notes });

  if (st.step === 'result') {

    const on = items.filter(x => x.on);
    const tot = { kcal: sum(on, x => x.kcal), p: sum(on, x => x.p), c: sum(on, x => x.c), f: sum(on, x => x.f) };
    const setItem = (i, k, v) => { const it = items.slice(); it[i] = { ...it[i], [k]: v }; setSt({ ...st, items: it }); };
    return html`<${Sheet} title="Esto calculé">

        <input class="inp" id=${'ai-k-' + i} style="width:84px;text-align:right;min-height:38px" inputmode="numeric" value=${Math.round(x.kcal)} onChange=${e => { const n = num(e.target.value) || 0; const k = x.kcal ? n / x.kcal : 1; const it = items.slice(); it[i] = { ...x, kcal: n, p: x.p * k, c: x.c * k, f: x.f * k }; setSt({ ...st, items: it }); }} aria-label="kcal" />
      </div>`)}</div>
      <${MacroPills} m=${tot} />
      <div class="seg">${MEALS.map(x => html`<button class=${meal === x.id ? 'on' : ''} onClick=${() => setMeal(x.id)}>${x.n}</button>`)}</div>
      <button class="btn block" disabled=${!on.length} onClick=${() => { on.forEach(x => logRaw(date, x, meal)); closeSheet(); toast(`${on.length} ${on.length === 1 ? 'alimento agregado' : 'alimentos agregados'}`); }}>Agregar ${on.length} ${on.length === 1 ? 'alimento' : 'alimentos'}</button>
      <button class="btn ghost block" onClick=${() => setSt({ step: 'input' })}>Intentar otra vez</button>
    <//>`;
  }
  return html`<${Sheet} title=${mode === 'photo' ? 'Foto de tu comida' : 'Describe lo que comiste'}>
    ${AI.images ? html`<div class="seg"><button class=${mode === 'photo' ? 'on' : ''} onClick=${() => setMode('photo')}>Foto</button><button class=${mode === 'text' ? 'on' : ''} onClick=${() => setMode('text')}>Escribir</button></div>` : null}
    ${st.err ? html`<p class="note" style="color:var(--warn)">${st.err}</p>` : null}

      <label class="field">Detalle opcional<input id="ai-ctx" class="inp" placeholder="Ej. eran 3 tacos de suadero con doble tortilla" value=${ctx} onInput=${e => setCtx(e.target.value)} /></label>

  <//>`;

function ExPickSheet({ mode, index, dayId }) {
  const cur = mode === 'swap' && S.active ? S.active.ex[index] : null;
  const curR = mode === 'rswap' ? S.routine.find(d => d.id === dayId).items[index] : null;
  const first = cur ? EX[cur.ex].m[0] : curR ? EX[curR.ex].m[0] : '';
  const pick = id => {
    if (mode === 'add') update(s => { s.active.ex.push(freeItem(id)); });
    else if (mode === 'swap') update(s => { const old = s.active.ex[index]; const it = freeItem(id); it.lo = old.lo; it.hi = old.hi; it.sets = old.sets.map(() => ({ w: it.target.w, r: null, done: false })); s.active.ex[index] = it; });
    else if (mode === 'radd') update(s => { const e = EX[id]; s.routine.find(d => d.id === dayId).items.push({ ex: id, sets: 3, lo: e.t === 'comp' ? 8 : 10, hi: e.t === 'comp' ? 12 : 15, rest: e.rest, inc: e.inc, note: '' }); });
    else if (mode === 'rswap') update(s => { const it = s.routine.find(d => d.id === dayId).items[index]; it.ex = id; it.rest = EX[id].rest; it.inc = EX[id].inc; it.note = ''; });
    closeSheet();
    toast(mode.includes('swap') ? 'Ejercicio cambiado' : 'Ejercicio agregado');
  };
  return html`<${Sheet} title=${mode.includes('swap') ? 'Cambiar ejercicio' : 'Agregar ejercicio'}>
    ${cur || curR ? html`<p class="small muted">Cambiando ${EX[(cur || curR).ex].n}. Te muestro primero los de ${first.toLowerCase()}.</p>` : null}
    <${ExList} onPick=${pick} initialMuscle=${first} actionLabel=${mode.includes('swap') ? 'Cambiar' : 'Agregar'} />
  <//>`;
}

function Backup() {
  const [txt, setTxt] = useState('');
  const [dl, setDl] = useState(null);
  useEffect(() => { (async () => { try { if (window.claude && window.claude.use) setDl(await window.claude.use('downloads')); } catch (e) { } })(); }, []);
  const data = JSON.stringify({ app: 'oso-gym', v: 1, exported: new Date().toISOString(), state: { ...S, active: null } });
  const copy = async () => { try { await navigator.clipboard.writeText(data); toast('Respaldo copiado'); } catch (e) { const el = document.getElementById('bk-out'); el.hidden = false; el.select(); toast('Selecciona y copia el texto'); } };
  const save = async () => {
    const filename = `oso-gym-${today()}.json`;
    try {
      if (dl) { await dl.save({ filename, data }); return; }
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) { toast('No se guardó el archivo'); }
  };
  const doImport = raw => {
    try {
      const j = JSON.parse(raw);
      const st = j.state || j;
      if (!st.settings || !Array.isArray(st.workouts)) throw 0;
      openSheet('confirm', { title: 'Importar respaldo', text: `Reemplaza todo lo que tienes ahora por el respaldo (${st.workouts.length} entrenos, ${(st.bw || []).length} pesadas).`, yes: 'Importar', danger: true, onYes: () => { S = normalize(st); update(() => { }, { now: true }); setTxt(''); toast('Respaldo importado'); } });
    } catch (e) { toast('Ese texto no es un respaldo válido'); }
  };
  const file = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(f); e.target.value = ''; };
  return html`
    <section class="card">
      <h3 class="h3">Exportar</h3>
      <p class="small muted">${S.workouts.length} entrenos, ${S.bw.length} pesadas y ${Object.keys(S.days).length} días de comida. Guárdalo en tus notas o en Drive de vez en cuando.</p>
      <div class="grid2">
        <button class="btn ghost" onClick=${copy}><${Icon} n="copy" />Copiar</button>
        <button class="btn ghost" onClick=${save}><${Icon} n="save" />Descargar</button>
      </div>
      <textarea id="bk-out" class="inp" readonly hidden value=${data}></textarea>
    </section>
    <section class="card">
      <h3 class="h3">Importar</h3>
      <textarea id="bk-in" class="inp" placeholder="Pega aquí el respaldo" value=${txt} onInput=${e => setTxt(e.target.value)}></textarea>
      <div class="grid2">
        <button class="btn ghost" disabled=${!txt.trim()} onClick=${() => doImport(txt)}>Importar texto</button>
        <label class="btn ghost" for="bk-file">Desde archivo<input id="bk-file" type="file" accept=".json,application/json,text/plain" hidden onChange=${file} /></label>
      </div>
    </section>
    <section class="card">
      <h3 class="h3">Empezar de cero</h3>
      <button class="btn danger block" onClick=${() => openSheet('confirm', { title: 'Borrar todo', text: 'Se borran entrenos, pesadas, comida y ajustes, aquí y en tu cuenta. No se puede deshacer. Exporta un respaldo antes.', yes: 'Borrar todo', danger: true, onYes: () => { S = defaultState(); update(() => { }, { now: true }); toast('Datos borrados'); } })}>Borrar todos mis datos</button>
    </section>
  `;
}

  const titles = {
    hoy: ['Hoy', `${DIAS_L[new Date().getDay()]} ${new Date().getDate()} de ${['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'][new Date().getMonth()]} · ¿Qué onda, ${s.settings.name}?`],
    entrenar: [s.active ? 'Entrenando' : 'Entrenar', s.active ? s.active.dayName : 'Rutina Torso / Pierna'],
    progreso: ['Progreso', 'Fuerza, peso y constancia'],
    comida: ['Comida', 'Calorías y proteína'],
    mas: ['Más', 'Rutina, ejercicios y ajustes'],
  };
  const [t1, t2] = titles[u.tab];
  const View = { hoy: HoyView, entrenar: TrainView, progreso: ProgressView, comida: FoodView, mas: MoreView }[u.tab];
  return html`
    <header class="top"><div class="top-in"><h1>${t1}<small>${t2}</small></h1><${SyncBadge} /></div></header>
    <main><div class=${'wrap ' + (u.timer ? 'with-timer' : '')}><${View} /></div></main>
    ${u.timer ? html`<${RestTimer} />` : null}
    <nav class="tabs" aria-label="Secciones"><div class="in">${TABS.map(t => html`<button class=${u.tab === t.id ? 'on' : ''} aria-current=${u.tab === t.id ? 'page' : null} onClick=${() => goTab(t.id)}><${Icon} n=${t.icon} />${t.n}${t.id === 'entrenar' && s.active && u.tab !== 'entrenar' ? html`<span class="live"></span>` : null}</button>`)}</div></nav>
    <${SheetHost} />
    ${u.toast ? html`<div class="toast" role="status">${u.toast.msg}${u.toast.action ? html`<button onClick=${() => { u.toast.action.fn(); ui({ toast: null }); }}>${u.toast.action.label}</button>` : null}</div>` : null}
  `;
}
render(html`<${App} />`, document.getElementById('app'));
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
</body>
</html>
